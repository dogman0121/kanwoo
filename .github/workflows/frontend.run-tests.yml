on:
  workflow_call:


jobs:
    test:
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: frontend
        steps:
          - name: Clone repo
            uses: actions/checkout@v3

          - name: Setup Node.js
            uses: actions/setup-node@v2

          - name: Install modules
            run: npm install

          - name: Test
            run: npm test
