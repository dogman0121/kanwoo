name: backend live

on:
  push:
    branches:
      - main
    paths:
      - '*'
      - 'backend/**'

  workflow_dispatch:


permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/backend.run-tests.yml

  build:
    needs: test
    uses: ./.github/workflows/backend.build.yml
    with:
      environment: live
      image-tag: backend-prod_${{ github.sha }}
    secrets:
      YC_SA_ID: ${{ secrets.YC_SA_ID }}


  deploy:
    needs: build
    uses: ./.github/workflows/backend.deploy.yml
    with:
      environment: live
      image-tag: backend-prod_${{ github.sha }}
    secrets:
      YC_SA_ID: ${{ secrets.YC_SA_ID }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      YANDEX_OAUTH_CLIENT_SECRET: ${{ secrets.YANDEX_OAUTH_CLIENT_SECRET }}
      DATABASE_URI: ${{ secrets.PROD_DATABASE_URI }}
      CACHE_URI: ${{ secrets.CACHE_URI }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
      MAIL_PORT: ${{ secrets.MAIL_PORT }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
